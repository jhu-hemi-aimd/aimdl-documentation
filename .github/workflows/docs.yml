name: docs

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish writes already in progress. A newer event supersedes queued work for
# the same PR; different PRs can build and publish independently.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Test preview configuration
        run: python -m unittest discover -s tests
      - name: Build strictly
        env:
          DOCS_PREVIEW_PR: ${{ github.event.pull_request.number }}
          DOCS_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7
      - name: Explain fork preview limitation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork PR checked successfully. Hosted previews require a branch in this repository.' >> "$GITHUB_STEP_SUMMARY"

  preview:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The publisher needs a Git checkout, but never executes PR source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: docs-site
          path: site
      - name: Publish or remove preview and update PR comment
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: docs.htmdec.org/aimdl
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
          qr-code: false

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Publish production and preserve open PR previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: |
            pr-preview/
            CNAME
          # Rebase concurrent preview writes instead of overwriting them.
          force: false
          attempt-limit: 10
