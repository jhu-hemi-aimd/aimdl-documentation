site_name: AIMD-L Documentation
site_description: Documentation portal for the AI for Materials Design Laboratory (AIMD-L)
site_url: https://docs.htmdec.org/aimdl/

repo_name: jhu-hemi-aimd/aimdl-documentation
repo_url: https://github.com/jhu-hemi-aimd/aimdl-documentation
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

copyright: Copyright &copy; Johns Hopkins University and AIMD-L contributors

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      enabled: !ENV [ENABLE_GIT_REVISION_DATE, true]
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

hooks:
  - scripts/preview.py
  - scripts/tags.py

extra_javascript:
  - assets/javascripts/tags.js

extra_css:
  - assets/stylesheets/tags.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

